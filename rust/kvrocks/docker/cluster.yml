services:
  redis-cluster:
    image: grokzen/redis-cluster:latest
    container_name: redis-cluster
    environment:
      - "IP=0.0.0.0"
      - "INITIAL_PORT=7000"
      - "MASTERS=3"
      - "SLAVES_PER_MASTER=0"
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
    restart: unless-stopped
